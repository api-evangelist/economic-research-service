staleness_note: >-
  Read 2026-09-06: the newest entry is 2024-12-18, and the page itself carries an "Updated:
  1/6/2025" stamp. ARMS is an annual survey, so a yearly cadence is expected, but there is no
  entry for the 2025 or 2026 release cycles.
