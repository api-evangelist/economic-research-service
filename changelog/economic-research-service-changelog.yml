api: USDA ERS Data APIs
description: >-
  ERS maintains a dated "Updates and Revisions" page for the ARMS Data API. It is a real
  changelog - it records both data refreshes and, in at least one entry, a breaking change to
  the response shape - but it is human-readable HTML only, has no feed, no version numbers and
  no per-entry anchors, and the most recent entry on it is from December 2024. The geospatial
  services have no changelog of any kind; their currency is expressed only as a "most current
  release date" column in the service table on the Geospatial APIs page.
scheme: none
scheme_note: >-
  There is no version identifier anywhere in the ARMS API - no path segment, no header, no
  query parameter, no version field in the response. Changes are announced only by date on the
  updates page. Consumers are identified by their api.data.gov key and, per ERS, "API keys
  provide a means to notify users of changes in the APIs" - so the notification channel is
  email to key holders, not the contract.
