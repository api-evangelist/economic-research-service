  - date: '2019-08-29'
    breaking: true
    type: contract
    highlights: >-
      Response-shape change. The "searching" and "formatting" properties were REMOVED from the
      "info" section of every API query result. Additive in the same release: a "description"
      property on each category record, a "desc" property on each report record, a "desc"
      property on each farmtype record, and a "decimal_display" property on each survey data
      record indicating how many decimals to display.
    removals:
      - info.searching
      - info.formatting
    additions:
      - category.description
      - report.desc
      - farmtype.desc
      - surveydata.decimal_display
    note: >-
      This removal shipped with no version bump, no deprecation window and no Sunset header -
      the only notice is this dated line. It is the clearest evidence in the record of how ERS
      handles a breaking change.
