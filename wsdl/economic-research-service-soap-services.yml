source: >-
  https://gisportal.ers.usda.gov/server/rest/services?f=json enumerated the ArcGIS Server
  service catalog; every MapServer was then probed for its SOAP contract at
  <service>/MapServer?wsdl. ERS's own Geospatial APIs page
  (https://www.ers.usda.gov/developer/geospatial-apis) states "JSON and SOAP interfaces are
  also available" and links to this same gisportal.ers.usda.gov host.
provider: Economic Research Service
providerId: economic-research-service
specification: WSDL 1.1 (SOAP 1.1 / 1.2)
description: >-
  Inventory of the SOAP contracts ERS publishes for its geospatial map services. The services
  run on ERS's own ArcGIS Enterprise host (gisportal.ers.usda.gov, ArcGIS Server 12.0.0); every
  WSDL declares a soap:address on that host, which is what establishes ERS ownership. Each
  MapServer exposes the same 55-operation Esri MapServer SOAP interface (Identify, Find,
  ExportMapImage, QueryFeatureData, QueryRelatedRecords, GetLegendInfo and so on); the server
  root exposes a 7-operation Catalog service. FeatureServer endpoints do NOT answer ?wsdl
  (HTTP 400) - they are ArcGIS REST/JSON only.
ownership_note: >-
  The WSDL targetNamespace is Esri's (http://www.esri.com/schemas/ArcGIS/3.6.0) because ArcGIS
  Server generates the contract, but every soap:address location is
  https://gisportal.ers.usda.gov:443/server/services/... - an ERS-operated host named in ERS's
  own developer documentation. The contract belongs to ERS; the schema vocabulary belongs to
  the software vendor.
