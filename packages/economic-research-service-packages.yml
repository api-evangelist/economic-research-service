description: >-
  ERS SHIPS NO CLIENT SDK, in any language, on any registry. What exists is a set of
  first-party code SAMPLES on GitHub - not installable libraries - last touched in 2013, plus
  one third-party R package on CRAN that has not been released since 2020. The ERS data-apis
  page still tells developers "Code snippets for the ARMS API are available in R (or REST)"
  without linking to them.
