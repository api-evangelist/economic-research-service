    note: >-
      First-party ERS repository of API code samples - dotNet-code.md, python-code.md,
      ruby-code.md, jquery-code.md - and nothing else. NOT A PACKAGE: there is no registry
      entry, no install command, no versioning and no build; a consumer copies the snippet.
      version is null because the distribution has no version to read. Last push 2013-12-12;
      the repo homepage still points at http://www.ers.usda.gov/developer/data-apis.aspx, a URL
      the current site no longer serves. Predates the ARMS API (2019) entirely, so these
      samples describe an earlier ERS data API.
