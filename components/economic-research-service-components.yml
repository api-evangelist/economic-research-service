third_party_clients:
  note: >-
    ERS explicitly supports desktop GIS clients as first-class consumers - "Browse the portal at
    gisportal.ers.usda.gov to select services... Use ArcGIS Pro catalog to browse the portal
    listed above." That is a real integration path, but it is Esri's client, not an ERS
    component.
