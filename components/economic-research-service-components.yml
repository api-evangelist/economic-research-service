provider: Economic Research Service
providerId: economic-research-service
description: >-
  Client-side and embeddable surfaces ERS publishes, as distinct from SDKs. There are two, and
  both are thin: an old first-party chart widget on GitHub, and the map atlases, which ERS
  frames as reference implementations of its own geospatial services rather than as embeddable
  components.
component_count: 1
families:
  - family: Charts of Note widget
    kind: embeddable-widget
    official: true
    loader: null
    url: https://github.com/USDA-REE-ERS/widgets
    version: null
    published: '2013-11-29'
    note: >-
      A single 7.5 KB source file ("Charts of Note Widget") in the first-party USDA-REE-ERS
      GitHub org, described as "Source code for widgets using ERS APIs". There is no hosted
      loader script, no CDN URL, no version and no documentation page on ers.usda.gov pointing
      at it. Recorded because it is real and first-party, not because it is usable today - it
      has not been touched since 2013 and the ERS APIs it was written against have since been
      replaced.
reference_applications:
  note: >-
    Not components, but the closest thing ERS offers to a worked client. ERS states that all of
    these applications "use data services developed and hosted by ERS as their map content
    source", and directs developers to browse them to discover which service backs which map -
    the atlas UI is effectively the human-readable index of the geospatial API.
  applications:
    - name: Atlas of Rural and Small-Town America
      url: https://www.ers.usda.gov/data-products/atlas-of-rural-and-small-town-america
      backing_services:
