description: >-
  Lifecycle posture for the ERS API surfaces. ERS publishes a changelog and a terms of service
  and nothing else: no versioning scheme, no deprecation policy, no Sunset or Deprecation
  headers, no SLA, no status page. The terms reserve a broad unilateral right to change or
  withdraw the API at any time, and one documented breaking change (2019-08-29) shipped with no
  notice window at all.
