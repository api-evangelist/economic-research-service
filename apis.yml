  note: >-
    Re-derived from plans/economic-research-service-plans-pricing.yml after that artifact was
    upgraded from a bulk-sweep scaffold to searched provider evidence on 2026-09-06. Both ERS
    API surfaces are free United States Government public data with no paid tier; the ARMS API
    needs a free api.data.gov key issued automatically from name and email, and api.data.gov
    publishes a DEMO_KEY that can be called before registering. The geospatial services need no
    credential at all.
